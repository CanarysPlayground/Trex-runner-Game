name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Root dependencies ──────────────────────────────────────────────────
      - name: Cache root node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: root-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install root dependencies
        run: npm ci

      - name: Security audit (root)
        run: npm audit --audit-level=high

      # ── API dependencies ───────────────────────────────────────────────────
      - name: Cache api node_modules
        uses: actions/cache@v4
        with:
          path: api/node_modules
          key: api-${{ runner.os }}-${{ hashFiles('api/package-lock.json') }}

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Security audit (api)
        working-directory: api
        run: npm audit --audit-level=high

      # ── API unit tests ─────────────────────────────────────────────────────
      - name: Run API tests
        working-directory: api
        run: npx jest --ci --forceExit

      # ── Playwright ─────────────────────────────────────────────────────────
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ── Start servers ──────────────────────────────────────────────────────
      - name: Start API server
        working-directory: api
        run: node server.js &

      - name: Start UI server
        run: npm start &

      - name: Wait for servers
        run: npx wait-on http://localhost:8080 http://localhost:3000 --timeout 30000

      # ── Server startup validation ──────────────────────────────────────────
      # Verifies the game page loads and all bird obstacle globals are present
      # in game.js. Fails fast before spending time on E2E if the JS is broken.
      - name: Validate game loads and bird globals are present
        run: |
          node - <<'EOF'
          const http = require('http');
          function get(url) {
            return new Promise((resolve, reject) => {
              http.get(url, res => {
                let body = '';
                res.on('data', d => body += d);
                res.on('end', () => resolve({ status: res.statusCode, body }));
              }).on('error', reject);
            });
          }
          (async () => {
            // 1. Game UI must return HTTP 200
            const ui = await get('http://localhost:8080/');
            if (ui.status !== 200) {
              console.error(`FAIL: UI server returned HTTP ${ui.status}`);
              process.exit(1);
            }
            console.log('PASS: UI server returned HTTP 200');

            // 2. game.js must be served and contain bird obstacle symbols
            const js = await get('http://localhost:8080/ui/game.js');
            if (js.status !== 200) {
              console.error(`FAIL: game.js not served (HTTP ${js.status})`);
              process.exit(1);
            }
            const required = [
              'birdActive', 'birdX', 'birdY',
              'BIRD_Y_LOW', 'BIRD_Y_HIGH', 'BIRD_W', 'BIRD_H',
              'spawnBird', 'drawBird', 'shieldActive',
            ];
            const missing = required.filter(sym => !js.body.includes(sym));
            if (missing.length > 0) {
              console.error(`FAIL: game.js is missing bird obstacle symbols: ${missing.join(', ')}`);
              process.exit(1);
            }
            console.log('PASS: All bird obstacle symbols present in game.js');

            // 3. Power-up symbols required for bird interaction tests
            const powerupRequired = [
              'powerupActive', 'powerupType', 'powerupX', 'powerupSpawnCooldown',
              'shieldTimer', 'scoreBoostActive', 'scoreBoostTimer',
              'birdWasAbsorbed', 'birdHitCooldown',
            ];
            const missingPowerup = powerupRequired.filter(sym => !js.body.includes(sym));
            if (missingPowerup.length > 0) {
              console.error(`FAIL: game.js is missing power-up symbols: ${missingPowerup.join(', ')}`);
              process.exit(1);
            }
            console.log('PASS: All power-up symbols present in game.js');
          })();
          EOF

      # ── E2E tests — full suite ─────────────────────────────────────────────
      - name: Run Playwright tests (full suite)
        run: npx playwright test --project=chromium --reporter=list

      # ── E2E tests — bird obstacle (isolated, labeled) ─────────────────────
      # Runs only bird tests with verbose output so failures are clearly
      # attributed to the bird feature in the Actions summary.
      - name: Run Playwright tests — bird obstacle
        if: success() || failure()   # run even if full suite step above failed
        run: |
          npx playwright test --project=chromium \
            --grep "bird|Bird|shield|Shield|boost|Boost|dodge|powerup|power-up" \
            --reporter=list \
            --retries=1
        env:
          TREX_GAME_URL: http://localhost:8080/

      # ── E2E tests — power-up × bird interactions (isolated) ───────────────
      # Targets tests that verify power-up behaviour specifically against the
      # bird obstacle: shield absorption, dodge bonus, and birdWasAbsorbed flag.
      - name: Run Playwright tests — power-up × bird interactions
        if: success() || failure()
        run: |
          npx playwright test --project=chromium \
            --grep "shield.*bird|bird.*shield|dodge|birdWasAbsorbed|scoreBoost|power-up" \
            --reporter=list \
            --retries=1
        env:
          TREX_GAME_URL: http://localhost:8080/

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

// Note: API server logs are not captured here since they're printed to stdout and would be interleaved with UI logs in the Actions summary. If needed, we could modify the server startup step to redirect output to a file and upload that as an artifact on failure.
