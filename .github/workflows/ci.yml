name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Root dependencies ──────────────────────────────────────────────────
      - name: Cache root node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: root-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install root dependencies
        run: npm ci

      - name: Security audit (root)
        run: npm audit --audit-level=high

      # ── API dependencies ───────────────────────────────────────────────────
      - name: Cache api node_modules
        uses: actions/cache@v4
        with:
          path: api/node_modules
          key: api-${{ runner.os }}-${{ hashFiles('api/package-lock.json') }}

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Security audit (api)
        working-directory: api
        run: npm audit --audit-level=high

      # ── API unit tests ─────────────────────────────────────────────────────
      - name: Run API tests
        working-directory: api
        run: npx jest --ci --forceExit

      # ── Playwright ─────────────────────────────────────────────────────────
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ── Start servers ──────────────────────────────────────────────────────
      - name: Start API server
        working-directory: api
        run: node server.js &

      - name: Start UI server
        run: npm start &

      - name: Wait for servers
        run: npx wait-on http://localhost:8080 http://localhost:3000 --timeout 30000

      # ── E2E tests ──────────────────────────────────────────────────────────
      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
